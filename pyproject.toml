[tool.poetry]
name = "job-search-app"
version = "0.1.0"
description = "A Streamlit-based job search application using python-jobspy"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
streamlit = "^1.31.0"
pandas = "^2.2.0"
python-jobspy = "^1.1.0"
sqlalchemy = "^2.0.0"
openai = "^1.0.0"
python-docx = "^1.1.0"
pypdf2 = "^3.0.0"
python-dotenv = "^1.0.0"
fpdf2 = "^2.7.0"
pydantic = "^2.0.0"
moviepy = "^2.2.1"
requests = "^2.32.5"
jinja2 = "^3.1.0"
pydyf = "0.10.0"
weasyprint = "61.2"
pip-system-certs = "^5.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
package-mode = false
